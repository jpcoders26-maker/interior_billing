# Local development stack. See docs/DOCKER.md for full usage.
#
# Two ways to work:
#   1. Fast iteration (recommended): `docker compose up postgres redis` for
#      just the dependencies, then `npm run dev` on the host — hot reload,
#      no image rebuilds.
#   2. Full stack in containers: `docker compose up --build` — no local
#      Node/Postgres/Redis install needed, but no hot reload (rebuild to
#      pick up code changes).
#
# Postgres's port is exposed to the host here (unlike docker-compose.prod.yml)
# so you can point a local DB client at it — a deliberate dev-only exception
# to "don't expose Postgres publicly" (see docs/DOCKER.md "Networking").

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teakworks
      POSTGRES_PASSWORD: teakworks_dev_password
      POSTGRES_DB: furniture_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teakworks -d furniture_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://teakworks:teakworks_dev_password@postgres:5432/furniture_db?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-only-secret-change-me-in-real-deployments-0000000000
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: Teakworks (Docker dev)

volumes:
  postgres_dev_data:
